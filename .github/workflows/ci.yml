name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy lightgbm
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install holographic-reservoir
      - name: Every module parses and imports
        run: |
          python -m compileall -q src tests
          python -c "import sys; sys.path.insert(0,'src'); import common, dataset; print('imports ok')"
      - name: The reservoir port matches the library it came from
        run: python tests/test_hrc_port.py
      - name: Manifest hashes still match the files
        run: |
          python - <<'PY'
          import json,hashlib
          m=json.load(open('manifest/MANIFEST.json'))
          bad=[f for f,h in m['files'].items()
               if hashlib.sha256(open(f,'rb').read()).hexdigest()[:16]!=h]
          print('mismatched:',bad); assert not bad, bad
          PY
